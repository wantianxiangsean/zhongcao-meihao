<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f1e6">
<title>种草美好</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b2412b'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23fff6ee' font-family='serif'%3E%E7%A7%8D%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=21">
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <header class="brand">
      <div class="brand-mark">种</div>
      <div class="brand-text">
        <h1>种草美好</h1>
        <p>美食 · 远方 · 屏幕 · 念头</p>
      </div>
      <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="收起侧栏"></button>
    </header>

    <div class="sidebar-scroll">
      <button class="nav-all" id="navAll">
        <span class="nav-all-icon"></span>
        <span class="nav-all-text">全部收藏</span>
        <span class="count" id="allCount">0</span>
      </button>

      <p class="section-label">按地点</p>
      <nav class="tree" id="tree" aria-label="地点分类"></nav>

      <p class="section-label">不在地图上</p>
      <div class="tree tree-extra" id="treeExtra"></div>
    </div>

    <footer class="sidebar-foot">
      <div class="stats" id="stats"></div>
      <button type="button" class="storage-line" id="storageLine"></button>
      <div class="side-actions">
        <button class="btn tiny ghost" id="exportBtn" title="把本地收藏备份到私有云端"></button>
        <button class="btn tiny ghost" id="importBtn" title="把云端最新收藏恢复到本地"></button>
      </div>
    </footer>

    <div class="sidebar-resizer" id="sidebarResizer" role="separator" aria-orientation="vertical" tabindex="0" title="拖动调整侧栏宽度"></div>
  </aside>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开侧栏"></button>
      <div class="search">
        <span class="search-icon"></span>
        <input id="searchInput" type="search" placeholder="搜索当前分类…" autocomplete="off" aria-label="搜索当前分类" title="支持模糊搜索（Ctrl / ⌘ + K）">
        <button class="search-clear" id="searchClear" aria-label="清除搜索" hidden></button>
      </div>
      <button class="btn primary add-btn" id="addBtn" aria-label="新建收藏"></button>
    </header>

    <section class="content">
      <div class="hero">
        <div class="hero-text">
          <p class="eyebrow" id="viewEyebrow">收藏地图</p>
          <h2 class="view-title" id="viewTitle">全部收藏</h2>
          <p class="view-sub" id="viewSub"></p>
        </div>
        <div class="toolbar">
          <div class="seg" id="typeSeg" role="group" aria-label="类型筛选"></div>
          <div class="seg" id="statusSeg" role="group" aria-label="完成状态筛选"></div>
        </div>
      </div>

      <div class="cards" id="cards"></div>
      <div class="empty-state" id="empty" hidden></div>
    </section>
  </main>
</div>

<div class="modal-backdrop" id="editorBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
    <header class="modal-head">
      <h2 id="editorTitle">新收藏</h2>
      <button class="icon-btn" id="editorClose" aria-label="关闭"></button>
    </header>
    <div class="modal-body" id="editorBody"></div>
    <footer class="modal-foot">
      <span class="form-hint" id="editorHint"></span>
      <div class="modal-foot-actions">
        <button class="btn ghost" id="editorCancel">取消</button>
        <button class="btn primary" id="editorSave">保存</button>
      </div>
    </footer>
  </div>
</div>

<div class="drawer-backdrop" id="drawerBackdrop" hidden>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="收藏详情"></aside>
</div>

<div class="modal-backdrop" id="settingsBackdrop" hidden>
  <div class="modal modal-settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <header class="modal-head">
      <h2 id="settingsTitle">私有数据仓库</h2>
      <button class="icon-btn" id="settingsClose" aria-label="关闭"></button>
    </header>
    <div class="modal-body">
      <p class="settings-intro">公开的网站只包含页面代码。收藏先保存在这个浏览器里，并使用仅限该私有仓库的 Token 同步到 GitHub；换设备时用「恢复」拉取云端最新数据。</p>
      <div class="cloud-status" id="cloudStatus" hidden></div>
      <div class="form-grid">
        <label class="field"><span class="label">GitHub 用户名</span><input id="setOwner" type="text" autocomplete="off" placeholder="例如 wantianxiangsean"></label>
        <label class="field"><span class="label">私有仓库名</span><input id="setRepo" type="text" autocomplete="off" placeholder="例如 zhongcao-meihao-data"></label>
        <label class="field"><span class="label">分支</span><input id="setBranch" type="text" value="main" autocomplete="off"></label>
        <label class="field"><span class="label">数据文件</span><input id="setPath" type="text" value="data/data.json" autocomplete="off"></label>
        <label class="field span-2"><span class="label">细粒度 Token</span><input id="setToken" type="password" autocomplete="off" placeholder="github_pat_..."></label>
      </div>
      <p class="settings-hint">创建方式：GitHub → Settings → Developer settings → Fine-grained tokens → Generate new token。只选这个私有仓库，权限只需 Contents: Read and write。Token 只保存在本机浏览器，不会写进公开代码。</p>
      <p class="settings-status" id="settingsStatus"></p>
    </div>
    <footer class="modal-foot">
      <div class="modal-foot-left">
        <button class="btn tiny ghost" id="ghBackup" hidden>手动备份</button>
        <button class="btn tiny ghost" id="ghRestore" hidden>从云端恢复</button>
        <button class="btn danger tiny" id="ghDisconnect" hidden>断开连接</button>
      </div>
      <div class="modal-foot-actions">
        <button class="btn ghost" id="ghCancel">取消</button>
        <button class="btn primary" id="ghConnect">测试并连接</button>
      </div>
    </footer>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js?v=21"></script>
</body>
</html>
